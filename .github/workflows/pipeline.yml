name: Test e rilascio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permessi minimi: la scrittura su GHCR serve solo al job di rilascio
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
      - name: Test logica di dominio
        working-directory: packages/core
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx vitest run

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Compila il backoffice
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  servizi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test di bot, pubblicatore, pagina pubblica e Worker
        working-directory: apps/bot
        run: |
          npm ci --no-audit --no-fund
          npm test

  database:
    runs-on: ubuntu-latest
    services:
      db:
        # Stessa immagine del Pi
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Applica le migrazioni
        run: sh deploy/migrator/applica.sh supabase/migrations
      - name: Test RLS
        run: sh deploy/migrator/test.sh supabase/tests/database

  rilascio:
    needs: [core, web, servizi, database]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Nome immagine (minuscolo)
        run: echo "IMMAGINE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gestionale-migrator" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/migrator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMMAGINE }}:latest
            ${{ env.IMMAGINE }}:${{ github.sha }}
